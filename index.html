<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Arcade</title>
<style>
:root{--ink:#1d1b3a;--paper:#fff7e6;--card:#fff;--muted:#6b6890;--a:#ff6b5b;--b:#19b8a6;--c:#ffb81f;--d:#7a5cff}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;line-height:1.45}
.screen{max-width:520px;margin:0 auto;padding:18px 14px 40px}
.hidden{display:none!important}
h1{font-size:clamp(2.2rem,10vw,3.2rem);font-weight:900;letter-spacing:-.03em;margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 16px}
label{display:block;font-weight:800;margin:14px 0 6px}
textarea{width:100%;min-height:200px;border:3px solid var(--ink);border-radius:14px;padding:12px;font:inherit;background:var(--card);color:var(--ink);resize:vertical}
.info{font-size:.9rem;margin:8px 0;color:var(--muted)}.info.bad{color:#c22d3e;font-weight:700}
button{font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:14px;padding:12px 16px;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.go{background:var(--b);width:100%;font-size:1.2rem;margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode.on{background:var(--c)}
.mode small{display:block;font-weight:500;color:inherit;opacity:.8}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.bar button{padding:6px 12px;box-shadow:0 3px 0 var(--ink)}
.hud{display:flex;gap:12px;font-weight:800;align-items:center}
.qcard{background:var(--ink);color:#fff;border-radius:18px;padding:14px 16px;margin-bottom:10px}
#q{font-size:clamp(1.2rem,5.4vw,1.7rem);font-weight:900;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chips:empty{display:none}
.chip{display:flex;align-items:center;gap:8px;background:#fff;color:var(--ink);border-radius:10px;padding:4px 10px 4px 4px;font-weight:700;font-size:.95rem}
.chip b,.ans b{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--k);color:var(--ink);flex:none}
canvas{display:block;margin:0 auto;max-width:100%;max-height:58vh;width:auto;height:auto;border:3px solid var(--ink);border-radius:16px;touch-action:none}
.answers{display:grid;gap:10px}
.ans{display:flex;align-items:center;gap:10px;text-align:left;border-color:var(--k);box-shadow:0 4px 0 var(--k);font-size:1.05rem}
.ans.right{background:var(--k)}.ans.dim{opacity:.35}
.fb{min-height:28px;margin:10px 2px;font-weight:800}.fb.good{color:#0b8a6f}.fb.bad{color:#c22d3e}
#end h2{font-size:2rem;margin:10px 0 0}.big{font-size:3rem;font-weight:900;color:var(--d)}
#missed{padding-left:20px}
</style>
</head>
<body>

<main id="setup" class="screen">
  <h1>Study Arcade</h1>
  <p class="sub">Paste your questions, pick a game, and study by playing.</p>
  <label for="qa">Your questions and answers</label>
  <textarea id="qa" spellcheck="false" placeholder="What is 7 × 8? | 56&#10;Capital of France? | Paris&#10;Red Planet? | Mars"></textarea>
  <div id="info" class="info">One per line: question | answer. Pasting from Quizlet works too.</div>
  <label>Pick a game</label>
  <div class="modes">
    <button class="mode on" data-m="flappy">🐤 Flappy Quiz<small>Fly through the right answer</small></button>
    <button class="mode" data-m="quiz">🧠 Quick Quiz<small>Tap the right answer</small></button>
  </div>
  <button class="go" id="start">▶ Start</button>
  <div class="row" style="margin-top:14px"><button id="sample">Load sample</button><button id="clear">Clear</button></div>
</main>

<main id="play" class="screen hidden">
  <div class="bar">
    <button id="back">← Back</button>
    <div class="hud"><span id="prog"></span><span id="score">0 pts</span><span id="lives"></span></div>
  </div>
  <div class="qcard"><div id="q"></div><div id="chips" class="chips"></div></div>
  <div id="flappyBox"><canvas id="cv" width="360" height="480"></canvas></div>
  <div id="quizBox" class="answers"></div>
  <div id="fb" class="fb"></div>
</main>

<main id="end" class="screen hidden">
  <h2 id="endTitle">Round complete</h2>
  <div class="big" id="final"></div>
  <div id="missedWrap"><label>Review these</label><ul id="missed"></ul></div>
  <button class="go" id="again">↻ Play again</button>
  <div class="row" style="margin-top:12px"><button id="redo">Practise missed</button><button id="edit">Edit questions</button></div>
</main>

<script>
const $=id=>document.getElementById(id);
const COL=["#ff6b5b","#19b8a6","#ffb81f","#7a5cff"],LET=["A","B","C","D"];
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const show=id=>["setup","play","end"].forEach(x=>$(x).classList.toggle("hidden",x!==id));
let items=[],answers=[],mode="flappy",queue=[],cur=null,opts=[],score=0,lives=3,missed=[],total=0,busy=false,tm=0,raf=0;

/* ---------- setup ---------- */
function parse(){
  items=[];let bad=0;
  $("qa").value.split("\n").forEach(l=>{l=l.trim();if(!l)return;const m=l.match(/^(.+?)\s*[|\t]\s*(.+)$/);m?items.push({q:m[1],a:m[2].trim()}):bad++});
  answers=[...new Map(items.map(i=>[i.a.toLowerCase(),i.a])).values()];
  $("info").className="info";
  $("info").textContent=items.length+" question"+(items.length===1?"":"s")+" ready."+(bad?" "+bad+" line(s) skipped. Use question | answer.":"");
  try{localStorage.setItem("sa_qa",$("qa").value)}catch(e){}
}
$("qa").addEventListener("input",parse);
$("sample").onclick=()=>{$("qa").value="What is 7 × 8? | 56\nWhat is the capital of France? | Paris\nWhich planet is the Red Planet? | Mars\nHow many sides does a hexagon have? | 6\nWhat gas do plants take in? | Carbon dioxide\nWho wrote Romeo and Juliet? | Shakespeare";parse()};
$("clear").onclick=()=>{$("qa").value="";parse()};
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mode").forEach(x=>x.classList.remove("on"));b.classList.add("on");mode=b.dataset.m});
$("start").onclick=()=>{parse();if(items.length<2||answers.length<2){$("info").className="info bad";$("info").textContent="Add at least 2 questions with different answers.";return}begin(items)};
try{$("qa").value=localStorage.getItem("sa_qa")||""}catch(e){}
parse();

/* ---------- shared game flow ---------- */
function hud(){$("score").textContent=score+" pts";$("lives").textContent="❤️".repeat(lives)+"🖤".repeat(3-lives)}
function fb(msg,good){$("fb").textContent=msg;$("fb").className="fb "+(good?"good":"bad")}
function stop(){clearTimeout(tm);cancelAnimationFrame(raf)}
function begin(list){
  stop();score=0;lives=3;missed=[];busy=false;queue=shuffle(list);total=queue.length;
  $("lives").classList.toggle("hidden",mode!=="flappy");
  $("flappyBox").classList.toggle("hidden",mode!=="flappy");
  $("quizBox").classList.toggle("hidden",mode!=="quiz");
  show("play");nextQ();
  if(mode==="flappy"){last=performance.now();raf=requestAnimationFrame(loop)}
}
function nextQ(){
  if(!queue.length)return finish();
  busy=false;cur=queue.shift();hud();fb("",1);
  const n=Math.min(mode==="flappy"?3:4,answers.length);
  const pool=shuffle(answers.filter(a=>a.toLowerCase()!==cur.a.toLowerCase()));
  opts=shuffle([cur.a,...pool.slice(0,n-1)]);
  $("q").textContent=cur.q;$("prog").textContent=(total-queue.length)+" of "+total;
  if(mode==="flappy"){
    nb=opts.length;resetBird();
    $("chips").innerHTML=opts.map((o,i)=>'<span class="chip" style="--k:'+COL[i]+'"><b>'+LET[i]+"</b>"+esc(o)+"</span>").join("");
  }else{
    $("chips").innerHTML="";$("quizBox").innerHTML="";
    opts.forEach((o,i)=>{const b=document.createElement("button");b.className="ans";b.style.setProperty("--k",COL[i]);b.innerHTML="<b>"+LET[i]+"</b>"+esc(o);b.onclick=()=>check(i);$("quizBox").appendChild(b)});
  }
}
function check(i){
  if(busy)return;busy=true;
  const ok=opts[i].toLowerCase()===cur.a.toLowerCase();
  [...$("quizBox").children].forEach((b,j)=>b.classList.add(opts[j].toLowerCase()===cur.a.toLowerCase()?"right":"dim"));
  if(ok){score+=10;fb("Correct! +10",1)}else{missed.push(cur);fb("Not quite. Answer: "+cur.a,0)}
  hud();tm=setTimeout(nextQ,ok?800:1700);
}
function finish(){
  stop();
  $("endTitle").textContent=lives<=0&&mode==="flappy"?"Out of lives":"Round complete";
  $("final").textContent=score+" points";
  $("missed").innerHTML=missed.map(m=>"<li><b>"+esc(m.q)+"</b> → "+esc(m.a)+"</li>").join("");
  $("missedWrap").classList.toggle("hidden",!missed.length);$("redo").classList.toggle("hidden",!missed.length);
  show("end");
}
$("back").onclick=()=>{stop();show("setup")};
$("again").onclick=()=>begin(items);
$("redo").onclick=()=>begin(missed.slice());
$("edit").onclick=()=>show("setup");

/* ---------- flappy engine ---------- */
const cv=$("cv"),cx=cv.getContext("2d"),W=360,H=480,G=48,PH=H-G,BX=90,R=14,WW=64,GAP=104;
let by=0,vy=0,wx=0,state="ready",last=0,nb=3;
function resetBird(){by=PH/2;vy=0;wx=W+30;state="ready"}
function flap(){if(mode!=="flappy"||$("play").classList.contains("hidden"))return;if(state==="ready")state="run";if(state==="run")vy=-6.2}
cv.addEventListener("pointerdown",e=>{e.preventDefault();flap()});
document.addEventListener("keydown",e=>{if((e.code==="Space"||e.code==="ArrowUp")&&mode==="flappy"&&!$("play").classList.contains("hidden")){e.preventDefault();flap()}});
function loop(t){raf=requestAnimationFrame(loop);const dt=Math.min(2,(t-last)/16.67||1);last=t;if(state==="run")step(dt);draw()}
function step(dt){
  vy=Math.min(8,vy+.34*dt);by+=vy*dt;wx-=2.3*dt;
  const bh=PH/nb;
  if(by+R>PH||by-R<0)return crash();
  if(wx<BX+R&&wx+WW>BX-R){const top=Math.floor(by/bh)*bh+(bh-GAP)/2;if(by-R<top||by+R>top+GAP)return crash()}
  if(wx+WW<BX-R)pick(Math.min(nb-1,Math.floor(by/bh)));
}
function crash(){
  lives--;hud();fb("Ouch! Fly through a gap.",0);
  if(lives<=0){state="pause";tm=setTimeout(finish,900)}else resetBird();
}
function pick(i){
  state="pause";const ok=opts[i].toLowerCase()===cur.a.toLowerCase();
  if(ok){score+=10;fb("Correct! +10",1)}else{lives--;missed.push(cur);fb("Not quite. Answer: "+cur.a,0)}
  hud();tm=setTimeout(()=>lives<=0?finish():nextQ(),ok?700:1500);
}
function draw(){
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#bfe9ff");g.addColorStop(1,"#fff1c9");
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  const bh=PH/nb;cx.textAlign="center";cx.textBaseline="middle";
  for(let i=0;i<nb;i++){
    const edge=(bh-GAP)/2,top=i*bh+edge;
    cx.fillStyle=COL[i];cx.fillRect(wx,i*bh,WW,edge);cx.fillRect(wx,top+GAP,WW,edge);
    cx.globalAlpha=.3;cx.fillRect(wx,top,WW,GAP);cx.globalAlpha=1;
    cx.fillStyle="#1d1b3a";cx.font="900 34px sans-serif";cx.fillText(LET[i],wx+WW/2,top+GAP/2);
  }
  cx.fillStyle="#1d1b3a";cx.fillRect(0,PH,W,G);
  cx.fillStyle="#ffb81f";cx.beginPath();cx.arc(BX,by,R,0,7);cx.fill();
  cx.fillStyle="#ff6b5b";cx.fillRect(BX+R-3,by-2,10,6);
  cx.fillStyle="#1d1b3a";cx.beginPath();cx.arc(BX+5,by-4,3,0,7);cx.fill();
  if(state==="ready"){cx.font="800 22px sans-serif";cx.fillText("Tap to fly ↑",W/2,PH/2-60)}
}
</script>
</body>
</html>
